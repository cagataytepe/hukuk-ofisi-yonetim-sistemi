      .ico-line-active { fill: none; stroke: #203039; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .ico-fill { fill: #eaf2f5; }
      .ico-fill-active { fill: #203039; }
      .accent { fill: #2f8f8a; }
      .badge { fill: rgba(255,255,255,.10); stroke: rgba(255,255,255,.18); stroke-width: 1; }
