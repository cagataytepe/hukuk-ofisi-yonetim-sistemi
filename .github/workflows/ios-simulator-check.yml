name: iOS Simulator Compile Check

# Apple hesabı ve imza gerektirmeden iOS tarafının (Swift bildirim eklentisi ve Rust kütüphanesi)
# derlendiğini doğrular. Hatalar, giriş yapmadan da görülebilen iş akışı uyarılarına yazılır.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-push-notifications
    paths:
      - "src-tauri/**"
      - "src/**"
      - "mobile.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-simulator-check.yml"

permissions:
  contents: read

concurrency:
  group: ios-simulator-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-check:
    name: Compile iOS targets for the simulator
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        # TestFlight iş akışıyla aynı Xcode sürümünde derlenir.
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -iv beta | sort -V | tail -n 1 || true)"
          if [[ -z "${XCODE}" ]]; then
            AVAILABLE="$(ls -d /Applications/Xcode*.app 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
            echo "::error title=Xcode 26 bulunamadı::Bu Mac makinesinde beta olmayan Xcode 26+ yok. Mevcut: ${AVAILABLE}"
            exit 1
          fi
          sudo xcode-select -s "${XCODE}/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | head -n 1) / iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Run push tests
        run: npm run test:push

      - name: Build mobile frontend
        run: npm run build

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Initialize iOS project
        shell: bash
        run: |
          set -o pipefail
          if ! npm run tauri -- ios init --ci 2>&1 | tee ios-init.log; then
            grep -iE "error|failed" ios-init.log | sort -u | head -n 15 | while IFS= read -r line; do
              echo "::error title=iOS proje hazırlığı::${line}"
            done
            exit 1
          fi

      - name: Provision push notification entitlement
        shell: bash
        run: |
          if ! npm run prepare:ios > prepare-ios.log 2>&1; then
            cat prepare-ios.log
            grep -E "Error|error" prepare-ios.log | head -n 5 | while IFS= read -r line; do
              echo "::error title=iOS hazırlık::${line}"
            done
            exit 1
          fi
          cat prepare-ios.log

      - name: Compile Swift plugin and Rust library for the iOS simulator
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build --manifest-path src-tauri/Cargo.toml --lib --target aarch64-apple-ios-sim 2>&1 | tee cargo-ios.log; then
            grep -E "error(\[[A-Z0-9]+\])?:|\.swift:[0-9]+:[0-9]+: error" cargo-ios.log | sort -u | head -n 25 | while IFS= read -r line; do
              echo "::error title=iOS derleme hatası::${line}"
            done
            exit 1
          fi
          echo "### iOS simulator compile" >> "${GITHUB_STEP_SUMMARY}"
          echo "Swift plugin and Rust library compiled for aarch64-apple-ios-sim." >> "${GITHUB_STEP_SUMMARY}"

      - name: Full simulator build (no signing)
        shell: bash
        run: |
          set -o pipefail
          if ! npm run tauri -- ios build --target aarch64-sim --debug --ci 2>&1 | tee ios-build.log; then
            grep -E "error:|\.swift:[0-9]+:[0-9]+: error|requires a development team|Signing" ios-build.log | sort -u | head -n 25 | while IFS= read -r line; do
              echo "::error title=Tam simülatör derlemesi::${line}"
            done
            exit 1
          fi

      - name: Launch app in the simulator and check it stays alive
        # Derlemek yetmez: açılışta çöken bir sürüm TestFlight'a gitmeden burada yakalanır.
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="tr.com.bkthukuk.ofisyonetim"
          APP=""
          while IFS= read -r candidate; do
            [[ -f "${candidate}/Info.plist" ]] || continue
            id="$(plutil -extract CFBundleIdentifier raw "${candidate}/Info.plist" 2>/dev/null || true)"
            platform="$(plutil -extract DTPlatformName raw "${candidate}/Info.plist" 2>/dev/null || true)"
            if [[ "${id}" == "${BUNDLE_ID}" && "${platform}" == "iphonesimulator" ]]; then APP="${candidate}"; break; fi
          done < <(find src-tauri/gen/apple "${HOME}/Library/Developer/Xcode/DerivedData" -type d -name "*.app" 2>/dev/null)
          if [[ -z "${APP}" ]]; then
            echo "::error title=Simülatör testi::Simülatör için derlenmiş .app bulunamadı."
            exit 1
          fi
          DEVICE="$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -n 1 | grep -oE '[0-9A-F-]{36}')"
          if [[ -z "${DEVICE}" ]]; then
            echo "::error title=Simülatör testi::Kullanılabilir iPhone simülatörü yok."
            exit 1
          fi
          xcrun simctl boot "${DEVICE}"
          xcrun simctl bootstatus "${DEVICE}" -b
          xcrun simctl install "${DEVICE}" "${APP}"
          PID="$(xcrun simctl launch "${DEVICE}" "${BUNDLE_ID}" | awk '{print $NF}')"
          echo "Launched ${BUNDLE_ID} (pid ${PID}) from ${APP}"
          sleep 25
          if kill -0 "${PID}" 2>/dev/null; then
            echo "::notice title=Simülatör testi::Uygulama açıldı ve 25 saniye boyunca çökmedi."
            xcrun simctl terminate "${DEVICE}" "${BUNDLE_ID}" || true
            exit 0
          fi
          REPORT="$(ls -t "${HOME}"/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -n 1 || true)"
          node scripts/ios-crash-summary.mjs "${REPORT}"
          exit 1
